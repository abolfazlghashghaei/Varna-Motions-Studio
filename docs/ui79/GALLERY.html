<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI79 — گالری بررسی</title><style>body{background:#081725;color:#edf5ff;font:14px/1.8 Tahoma,Arial,sans-serif;margin:1rem}a{color:#92dfef}label{display:inline-flex;gap:.5rem;margin:.5rem}select{min-height:36px;font:inherit}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:1rem}figure{margin:0;min-width:0}img{max-width:100%;height:auto;display:block;border:1px solid #547384;border-radius:12px}figcaption{padding:.5rem}aside{margin-bottom:1rem}h1{font-size:22px}</style><h1>UI79 · نوار تطبیقی و حرکت تازه</h1><p><a href="v-return.gif">دیدن انیمیشن تازهٔ V</a> · <a href="icons-809x580.png">نوار خودکار در حالت آیکون</a> · <a href="panel-809x580.png">پنل در اندازهٔ تصویر گزارش‌شده</a></p><p>تصاویر پنل واقعی در Chromium؛ پل افتر شبیه‌سازی شده است. تصویر مرجع فقط طرح ارسالی شماست.</p><aside><label>صفحه <select id="page"></select></label><label>عرض <select id="width"><option>250</option><option>400</option><option selected>620</option><option>1400</option></select></label><label>تم <select id="theme"><option value="dark">تیره</option><option value="light">روشن</option></select></label></aside><main><figure><figcaption>نسخهٔ اصلاح‌شده</figcaption><img id="after" alt="پنل اصلاح‌شده"></figure><figure id="beforeBox"><figcaption>UI78 پیش از اصلاح — عرض ۶۲۰</figcaption><img id="before" alt="پنل پیش از اصلاح"></figure><figure id="refBox"><figcaption>طرح مرجع ارسالی — عرض ۶۲۰</figcaption><img id="reference" alt="طرح مرجع"></figure></main><p><a href="REPORT_FA.md">گزارش تغییرات</a> · <a href="MANUAL_TEST_FA.md">آزمون دستی</a></p><script>
const names=['home','audio','text','motion','kinetic','templates','bg','table','sfx','music','brand','safe','ai','keywords','translate','easing49','director','assistant49','tools','resources','output','settings'];const labels=['خانه','ساخت زیرنویس','ویرایش متن','موشن','تایپوگرافی','استایل‌ها','بک‌گراند','جدول','افکت صوتی','ساخت صدا','برند','محدوده امن','اصلاح هوشمند','کلمات مهم','ترجمه','منحنی حرکت','دستیار پروژه','دستیار اسکریپت','ابزارها','منابع سیستم','خروجی','تنظیمات'];const $=s=>document.getElementById(s);names.forEach((name,i)=>{const o=document.createElement('option');o.value=name;o.textContent=labels[i];$('page').append(o)});function show(){const name=$('page').value,theme=$('theme').value;$('after').src='gallery/after-'+name+'-'+$('width').value+'-'+theme+'.png';$('beforeBox').hidden=!['home','table','kinetic','text','audio','motion'].includes(name);$('before').src='before/'+name+'-620-'+theme+'.png';$('refBox').hidden=!['home','table','kinetic'].includes(name);$('reference').src='reference/'+name+'-620.png'}['page','width','theme'].forEach(id=>$(id).onchange=show);show();</script></html>
