<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقایسهٔ مرحله A</title><style>body{font:14px/1.7 Tahoma,sans-serif;margin:24px;background:#f1f5f9;color:#0f172a}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}select{min-height:36px;font:inherit;padding:4px 8px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}figure{margin:12px 0}img{width:100%;height:auto;border:1px solid #64748b}figcaption{font-weight:bold;font-size:16px}@media(max-width:700px){main{grid-template-columns:1fr}}</style><h1>مقایسهٔ قبل و بعد — مرحلهٔ A</h1><p>همان متن، اندازهٔ ۶۲۰×۶۴۰ و تم؛ تصاویر مرورگرند. اجرای بومی افتر تایید نشده است.</p><header><label>صفحه <select id="page"><option value="home">خانه</option><option value="text">متن</option><option value="table">جدول</option><option value="motion">موشن</option><option value="kinetic" selected>تایپوگرافی کلمه‌ای</option><option value="templates">استایل‌ها</option><option value="sfx">افکت صوتی</option><option value="music">ساخت صدا</option><option value="audio">ساخت زیرنویس</option><option value="ai">اصلاح هوشمند</option><option value="bg">بکگراند</option><option value="brand">برند</option><option value="director">دستیار پروژه</option><option value="easing49">منحنی حرکت</option><option value="assistant49">دستیار اسکریپت</option><option value="safe">محدودهٔ امن</option><option value="keywords">کلمات مهم</option><option value="translate">ترجمه</option><option value="tools">ابزارهای افزوده</option><option value="resources">منابع سیستم</option><option value="output">خروجی</option><option value="settings">تنظیمات</option></select></label><label>تم <select id="theme"><option value="light">روشن</option><option value="dark">تیره</option></select></label><a href="STAGE_A_FA.md">گزارش مرحله</a></header><main><figure><figcaption>قبل</figcaption><img id="before" alt="تصویر قبل"></figure><figure><figcaption>بعد</figcaption><img id="after" alt="تصویر بعد"></figure></main><script>const page=document.getElementById('page'),theme=document.getElementById('theme');function show(){for(const phase of ['before','after'])document.getElementById(phase).src=phase+'/'+theme.value+'/'+page.value+'.png';}page.onchange=theme.onchange=show;show();</script></html>
