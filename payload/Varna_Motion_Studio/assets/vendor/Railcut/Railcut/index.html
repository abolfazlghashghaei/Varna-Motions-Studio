<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Railcut</title>
    <!-- Global styles (Premiere-inspired theme) -->
    <link rel="stylesheet" href="./css/styles.css" />
    <!-- Component styles (built from React) -->
    <link rel="stylesheet" href="./css/main.css" />
    <style>
      /* Critical CSS for initial load (inline for fast paint) */
      .loading {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #999;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading">Loading Railcut...</div>
    </div>
    <!-- CSInterface must load before the app (provides window.CSInterface) -->
    <script src="./js/CSInterface.js"></script>
    <!-- Main React application -->
    <script src="./js/main.js"></script>
  </body>
</html>
