<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>مرحله B — مقایسه</title>
<style>body{margin:0;background:#e9eef6;color:#14243b;font:16px/1.7 system-ui,sans-serif}header{padding:1rem;position:sticky;top:0;background:#fff;border-bottom:1px solid #9ba9bf;z-index:2}label{display:inline-flex;gap:.5rem;margin:.25rem}select{font:inherit;padding:.3rem}main{display:grid;grid-template-columns:1fr 1fr;gap:1rem;padding:1rem}figure{margin:0;min-width:0}figcaption{text-align:center;font-weight:700}img{display:block;max-width:100%;height:auto;margin:auto;box-shadow:0 .25rem 1rem #0003}p{margin:.3rem}@media(max-width:700px){main{grid-template-columns:1fr}}</style>
<header><b>پایلوت جدول و تایپوگرافی — قبل / بعد</b><p>فقط این دو صفحه تغییر کرده‌اند؛ تصاویر، رندر داخل افتر نیستند.</p><label>صفحه<select id="page"><option value="table">جدول</option><option value="kinetic">تایپوگرافی</option></select></label><label>عرض<select id="width"><option>250</option><option>400</option><option selected>620</option><option>1400</option></select></label><label>تم<select id="theme"><option value="light">روشن</option><option value="dark">تیره</option></select></label><label>زبان<select id="language"><option value="fa">فارسی</option><option value="en">English</option></select></label></header>
<main><figure><figcaption>قبل — b350500</figcaption><a id="beforeLink"><img id="before" alt="قبل از تغییر"></a></figure><figure><figcaption>بعد — پایلوت B</figcaption><a id="afterLink"><img id="after" alt="بعد از تغییر"></a></figure></main>
<script>const keys=['page','width','theme','language'],read=id=>document.getElementById(id).value;function update(){for(const kind of ['before','after']){const file=kind+'/'+read('language')+'/'+read('theme')+'/'+read('page')+'-'+read('width')+'.png';document.getElementById(kind).src=file;document.getElementById(kind+'Link').href=file;}}keys.forEach(id=>document.getElementById(id).addEventListener('change',update));update();</script></html>
