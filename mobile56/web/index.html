<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#111019" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' blob: data:; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; connect-src 'self'; frame-src 'none'; object-src 'none'"
    />
    <title>Varna Studio Mobile</title>
    <link rel="stylesheet" href="mobile.css" />
  </head>
  <body>
    <header class="top">
      <button id="projectMenu" aria-label="پروژه" class="icon">☷</button>
      <div class="identity">
        <span class="logo">V</span>
        <div><b>STUDIO</b><small id="projectName">Untitled</small></div>
      </div>
      <button id="undo" class="icon" aria-label="Undo">↶</button
      ><button id="redo" class="icon" aria-label="Redo">↷</button
      ><button id="export" class="primary compact" data-i18n="Export|خروجی">
        خروجی ↗
      </button>
    </header>
    <main>
      <section class="monitor">
        <div class="monitor-label">
          <span class="dot"></span
          ><span data-i18n="PROGRAM|پیش‌نمایش">پیش‌نمایش</span
          ><button id="formatBadge">9:16 · 720p</button>
        </div>
        <div class="canvas-wrap">
          <canvas id="preview" width="720" height="1280"></canvas>
          <div id="empty" class="empty">
            <b data-i18n="Make your next frame.|قاب بعدی را بساز."
              >قاب بعدی را بساز.</b
            ><span
              data-i18n="Add a video, a title, or a glass table.|ویدیو، متن یا جدول شیشه‌ای اضافه کن."
              >ویدیو، متن یا جدول شیشه‌ای اضافه کن.</span
            ><button id="demo" data-i18n="Try a sample|ساخت نمونه">
              ساخت نمونه
            </button>
          </div>
        </div>
        <div class="transport">
          <button id="begin" class="icon">⏮</button
          ><button id="play" class="play">▶</button
          ><output id="time">00:00.00</output><span class="divider"></span
          ><button id="split" class="icon" data-i18n="Split|برش">برش</button
          ><button id="delete" class="icon" data-i18n="Delete|حذف">حذف</button
          ><button id="duplicate" class="icon" aria-label="Duplicate">⧉</button>
        </div>
      </section>
      <section class="timeline-panel">
        <div class="timeline-top">
          <b data-i18n="TIMELINE|تایم‌لاین">تایم‌لاین</b
          ><button id="snap57" aria-pressed="true" title="Snap">⌁</button
          ><button id="trackAdd" data-i18n="+ Track|+ لایه">+ لایه</button
          ><label class="zoom"
            >−<input
              id="zoom"
              type="range"
              min="25"
              max="180"
              value="65"
              aria-label="Timeline zoom"
            />+</label
          ><output id="duration">0.0 s</output>
        </div>
        <div id="timelineScroll"><div id="timeline"></div></div>
      </section>
      <section class="tools">
        <nav id="tabs">
          <button data-tab="media" class="active">
            <span>▧</span><small data-i18n="Media|رسانه">رسانه</small></button
          ><button data-tab="text">
            <span>T</span><small data-i18n="Text|متن">متن</small></button
          ><button data-tab="graphics">
            <span>◇</span
            ><small data-i18n="Graphics|گرافیک">گرافیک</small></button
          ><button data-tab="style">
            <span>◐</span><small data-i18n="Style|استایل">استایل</small></button
          ><button data-tab="audio">
            <span>≋</span><small data-i18n="Audio|صدا">صدا</small>
          </button>
        </nav>
        <div id="inspector"></div>
      </section>
    </main>
    <footer>
      <span
        id="status"
        role="status"
        data-i18n="Local project · autosaved|پروژهٔ محلی · ذخیرهٔ خودکار"
        >پروژهٔ محلی · ذخیرهٔ خودکار</span
      ><button id="theme57" aria-label="Theme">◐</button
      ><button id="language">EN</button>
    </footer>
    <dialog id="sheet">
      <header>
        <b id="sheetTitle"></b><button id="sheetClose" class="icon">×</button>
      </header>
      <div id="sheetBody"></div>
    </dialog>
    <dialog id="renderDialog">
      <b data-i18n="Rendering your film|در حال ساخت ویدیو">در حال ساخت ویدیو</b
      ><progress id="renderProgress" max="1" value="0"></progress
      ><output id="renderStatus"></output
      ><button id="cancelRender" data-i18n="Cancel|لغو">لغو</button>
    </dialog>
    <input
      id="filePicker"
      hidden
      type="file"
      accept="video/*,image/*,audio/*"
    />
    <script src="shared/studio52-core.js"></script>
    <script src="shared/editor51-core.js"></script>
    <script src="shared/table-layout.js"></script>
    <script src="shared/table54-renderer.js"></script>
    <script src="shared/titles53.js"></script>
    <script src="shared/kinetic40.js"></script>
    <script src="engines/captions57.js"></script>
    <script src="engines/project57.js"></script>
    <script src="engines/timeline57.js"></script>
    <script src="engines/composition57.js"></script>
    <script src="mobile-core.js"></script>
    <script src="engines/media-analysis57.js"></script>
    <script src="mobile-tools57.js"></script>
    <script src="mobile.js"></script>
  </body>
</html>
